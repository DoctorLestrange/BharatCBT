name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Run unit & mock exam verification tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Verify production artifacts
        run: |
          test -f dist/index.html
          test -f dist/favicon.svg
          test -f dist/.nojekyll

      - name: Upload production dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: bharat-cbt-dist
          path: dist/
          retention-days: 7
